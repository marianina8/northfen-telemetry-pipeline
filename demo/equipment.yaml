# Synthetic render-farm catalog for Northfen Studios (fictional animation/VFX
# studio). Pools, nodes, metrics, alert limits and history are invented.
#
# Each "equipment" entry is a render pool: the unit alerts are grouped by.
# Its sensors mix per-node metrics (frame time, temperature, memory) with the
# shared services that pool depends on (storage, licenses). Grouping flags per
# pool is what lets "every node slowed down at once" read as ONE incident that
# points at shared storage rather than N separate node problems.
#
#   base / noise   nominal value and noise (std) used by the simulator
#   decimals       how the metric is reported (rounding)
#   spec           fixed alert limits, the way most farm monitoring is set up.
#                  Only the naive comparison in compare/ uses these; the real
#                  detector learns each metric's own normal instead.
#   history        recent maintenance / changes / incidents. Seeded into the
#                  state store and shown to the explain step.

equipment:
  - id: FARM-LGT
    name: Lighting render pool
    tool_type: gpu_render_pool
    line: Pool A · 64 GPU nodes · Burbank DC row 2
    sensors:
      - { id: node07_frame_time, type: frame_time,  unit: min/frame, base: 11.0, noise: 0.4,  decimals: 2, spec: { lo: 0.0, hi: 14.0 } }
      - { id: node12_frame_time, type: frame_time,  unit: min/frame, base: 11.2, noise: 0.4,  decimals: 2, spec: { lo: 0.0, hi: 14.0 } }
      - { id: node07_gpu_temp,   type: temperature, unit: C,         base: 71.0, noise: 0.8,  decimals: 1, spec: { lo: 30.0, hi: 83.0 } }
      - { id: nas_read_latency,  type: io_latency,  unit: ms,        base: 4.0,  noise: 0.25, decimals: 2, spec: { lo: 0.0, hi: 10.0 } }
    history:
      - { days_ago: 2,  kind: change,      summary: "GPU driver 560.94 rolled to node12 and node14 only (render-node image v42); rest of the pool still on 555.x." }
      - { days_ago: 4,  kind: change,      summary: "NAS snapshot schedule moved from 03:00 to 01:00 to finish before dailies." }
      - { days_ago: 9,  kind: incident,    summary: "Overnight lighting renders ran ~30% slow for 2 hours; traced to a filer rebuild on the shared NAS." }
      - { days_ago: 15, kind: maintenance, summary: "node07 GPU fan replaced after a thermal-throttling ticket." }
      - { days_ago: 33, kind: maintenance, summary: "Pool re-imaged; render-node image v41." }

  - id: FARM-FX
    name: FX simulation pool
    tool_type: cpu_sim_pool
    line: Pool B · 24 high-memory nodes · Burbank DC row 3
    sensors:
      - { id: sim_node21_cpu_temp, type: temperature, unit: C,          base: 68.0,  noise: 0.5,  decimals: 2, spec: { lo: 30.0, hi: 72.0 } }
      - { id: sim_node21_mem_used, type: memory,      unit: GB,         base: 180.0, noise: 3.0,  decimals: 2, spec: { lo: 0.0,  hi: 195.0 } }
      - { id: cache_write_latency, type: io_latency,  unit: ms,         base: 6.0,   noise: 0.3,  decimals: 2, spec: { lo: 0.0,  hi: 9.0 } }
      - { id: failed_frames,       type: error_count, unit: frames/min, base: 2.0,   noise: 1.0,  decimals: 0, spec: { lo: 0.0,  hi: 12.0 } }
    history:
      - { days_ago: 1,  kind: change,      summary: "New asset version published for the ep104 ocean sim (heavier cache, new texture paths)." }
      - { days_ago: 3,  kind: maintenance, summary: "Sim cache volume expanded; old ep101 caches archived." }
      - { days_ago: 8,  kind: incident,    summary: "Frames failed for 20 minutes after a texture path moved; fixed by re-publishing the asset." }
      - { days_ago: 20, kind: maintenance, summary: "node21 thermal paste redone during quarterly PM." }
      - { days_ago: 41, kind: maintenance, summary: "Quarterly PM completed, no findings." }

  - id: COMP-POOL
    name: Compositing render pool
    tool_type: cpu_comp_pool
    line: Pool C · 32 nodes (new) · Burbank DC row 4
    sensors:
      - { id: comp_frame_time, type: frame_time,  unit: s/frame, base: 42.0, noise: 1.5, decimals: 2, spec: { lo: 0.0,  hi: 51.0 } }
      - { id: comp_mem_used,   type: memory,      unit: GB,      base: 40.0, noise: 1.0, decimals: 2, spec: { lo: 0.0,  hi: 50.0 } }
      - { id: comp_node_temp,  type: temperature, unit: C,       base: 64.0, noise: 0.3, decimals: 2, spec: { lo: 30.0, hi: 69.0 } }
    history:
      - { days_ago: 3,  kind: change,      summary: "Comp pool expanded with 12 new nodes for the season-2 push." }
      - { days_ago: 8,  kind: change,      summary: "Pool released to production on the new row 4 racks." }
      - { days_ago: 14, kind: incident,    summary: "Comp jobs stalled on license checkout for 10 minutes; license server restarted." }
      - { days_ago: 26, kind: maintenance, summary: "Render manager upgraded; job chunking defaults changed." }

  - id: SVC-CORE
    name: Shared farm services
    tool_type: shared_services
    line: License server, filer and render manager
    sensors:
      - { id: license_seats_used, type: license,     unit: seats, base: 180.0, noise: 4.0,  decimals: 0, spec: { lo: 0.0,  hi: 240.0 } }
      - { id: license_wait,       type: license,     unit: s,     base: 2.0,   noise: 0.05, decimals: 3, spec: { lo: 0.0,  hi: 3.0 } }
      - { id: filer_latency,      type: io_latency,  unit: ms,    base: 3.0,   noise: 0.2,  decimals: 2, spec: { lo: 0.0,  hi: 8.0 } }
      - { id: scheduler_host_temp, type: temperature, unit: C,    base: 52.0,  noise: 0.4,  decimals: 2, spec: { lo: 30.0, hi: 60.0 } }
    history:
      - { days_ago: 5,  kind: maintenance, summary: "License monitor agent upgraded to v3.2." }
      - { days_ago: 12, kind: incident,    summary: "License dashboard froze for one shift; monitor agent restarted." }
      - { days_ago: 30, kind: maintenance, summary: "Filer firmware updated." }
