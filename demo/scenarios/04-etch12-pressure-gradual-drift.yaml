name: etch12-pressure-gradual-drift
title: Gradual chamber-pressure drift - Etch Tool 12
category: gradual_drift
description: >
  Chamber pressure on Etch Tool 12 creeps upward about 0.01 mTorr per reading
  from tick 40 - too slow for any single reading to look alarming, and it
  never reaches the spec-sheet limit of 32 mTorr. The detector's baseline
  follows it, and the baseline moving away from the warm-up reference is
  what flags it (drift rule). Should flag; lower severity.
equipment_id: ETCH-12
ticks: 120
seed: 404
sensors:
  chamber_pressure:
    patterns:
      - { type: drift, start: 40, per_tick: 0.012 }
