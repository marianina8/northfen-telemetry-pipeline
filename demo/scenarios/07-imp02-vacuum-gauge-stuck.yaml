name: imp02-vacuum-gauge-stuck
title: Vacuum gauge stuck at one value - Ion Implanter 2
category: sensor_fault
description: >
  From tick 50 the beamline vacuum gauge on Ion Implanter 2 reports exactly
  the same value every reading. The value itself looks perfectly normal, so
  a threshold never fires - but a real analog gauge always wiggles. Flags as
  a sensor fault (stuck rule), which opens a ticket without a model call.
equipment_id: IMP-02
ticks: 120
seed: 707
sensors:
  beamline_vacuum:
    patterns:
      - { type: stuck, start: 50 }
