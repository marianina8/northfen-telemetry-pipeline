name: etch12-temp-dropout
title: Temperature sensor dropout - Etch Tool 12
category: sensor_fault
description: >
  The ESC temperature channel on Etch Tool 12 stops reporting for eight
  readings starting at tick 60, then comes back. Missing data is not "zero"
  and not "normal": after three missing readings in a row it flags as a
  sensor fault (dropout rule) and opens a ticket without a model call.
equipment_id: ETCH-12
ticks: 120
seed: 808
sensors:
  esc_temp:
    patterns:
      - { type: dropout, start: 60, length: 8 }
